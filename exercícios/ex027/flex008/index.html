<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        div.container{
            background-color: lightgreen;
            height: 80vh;

            flex-flow: row wrap;
            
            justify-content: space-evenly;
            align-items: center;
            display: flex;
        }

        div.item{
            background-color: rgb(102, 196, 228);
            border: 1px solid black;
            text-align: center;
            width: 20px;
            height: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        div#i1{
            align-self: flex-start;  
        }

        div#i2{
            align-self: center;  
        }
        div#i3{
            align-self: auto; /*puxou a config do pai/container (align-items: center)*/ 
        }
        div#i4{
            align-self: flex-end;  
        }
        div#i5{
            align-self: stretch;  
        }
        div#i6{
            align-self: ;  
        }
        div#i7{
            align-self: ;  
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>

    </div>
</body>
</html>
