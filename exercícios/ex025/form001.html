<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <!--Está forma de fazer um formulário irá funcionar, porém não é a forma ideal-->

    <form action="cadastro.php" method="post" autocomplete="off ">
        <p><label for="inome">Nome:</label> <!--No for, sempre colocamos o id, ou seja, inome-->
            <input type="text" name="nome" id="inome"></p>
        
        <p><label for="isobrenome">Sobrenoome:</label> 
            <input type="text" name="sobrenome" id="isobrenome"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
