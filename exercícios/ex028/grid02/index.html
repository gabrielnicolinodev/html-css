<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template: repeat(3, auto) / repeat(3, auto);/*primeiro o rows e depois o column*/
            gap: 10px;
            place-items: start center;
            place-content: space-between end;
            /*
            Para os places, primeiro vem o align e depois o justify
            
            Items: itens
            Content: conteúdo (não é o container e sim o conteúdo)*/
        }

        div.item{
            border: 3px solid red;
            padding: 5px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bolder;
            
        }
    
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
    
</body>
</html>
