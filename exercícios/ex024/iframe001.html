<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 1px solid black;
            border-radius: 15px;
        }
    </style>
</head>
<body>  
    <h1>Testando o uso de iframe</h1>
    <p>
        Acessando o site do
        
        <!--Um Iframe, por padrão, possui 300px de largura e 150px de altura.-->
        <!--Independentemente do frameborder que eu colocar ele sempre ficará com a borda de 1px, a não ser o 0 que remove a borda.-->

        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500"  scolling="auto">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a>
        </iframe>

        para aprender a programar
    </p>
    <p>
        O repositório do Guanabara no
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
            <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a>
        </iframe>
        também é bem legal!
    </p>
</body>
</html>
